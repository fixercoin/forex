<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIXORIUM AI SIGNAL</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#0f1115; color:#e6e8ec; padding:24px; padding-bottom:80px; }
  .header-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  h1 { font-size:22px; margin:0; letter-spacing:.5px; }
  .icon-btn { background:transparent; color:#e6e8ec; border:0; width:42px; height:42px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:color .2s; flex-shrink:0; padding:0; }
  .icon-btn:hover { color:#2563eb; }
  .icon-btn:disabled { opacity:.5; cursor:not-allowed; }
  .icon-btn.spinning svg { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .marquee-bar { position:sticky; top:0; z-index:10; background:#181b22; border:1px solid #222633; border-radius:8px; overflow:hidden; margin-bottom:20px; padding:8px 0; }
  .marquee-track { display:inline-block; white-space:nowrap; padding-left:100%; animation:marquee 25s linear infinite; font-size:13px; color:#8a93a6; }
  .marquee-track strong { color:#e6e8ec; }
  @keyframes marquee { from { transform:translateX(0); } to { transform:translateX(-100%); } }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
  .card { background:#181b22; border-radius:12px; padding:16px; border:1px solid #222633; text-transform:uppercase; }
  .pair { font-size:18px; font-weight:600; }
  .price { font-size:22px; margin:6px 0; font-variant-numeric:tabular-nums; }
  .row { display:flex; justify-content:space-between; font-size:13px; color:#8a93a6; margin:4px 0; }
  .row span:last-child { color:#e6e8ec; }
  .levels { margin-top:12px; padding:10px; border-radius:8px; background:#12151c; border:1px solid #222633; }
  .levels .row { margin:3px 0; }
  .levels .entry-val { color:#60a5fa; }
  .levels .tp-val { color:#22c55e; }
  .levels .sl-val { color:#ef4444; }
  .levels .lot-val { color:#f59e0b; }
  .signal { margin-top:12px; padding:10px; border-radius:8px; text-align:center; font-weight:700; }
  .BUY { background:rgba(34,197,94,.15); color:#22c55e; }
  .SELL { background:rgba(239,68,68,.15); color:#ef4444; }
  .NEUTRAL { background:rgba(245,158,11,.15); color:#f59e0b; }
  .conf { font-size:12px; color:#8a93a6; text-align:center; margin-top:6px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; background:#222633; color:#8a93a6; margin-left:6px; }
  .news { margin-top:16px; font-size:12px; color:#6b7280; }
  .cta-bar { position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:14px 16px; background:#0f1115; border-top:1px solid #222633; }
  .cta-bar a { color:#e6e8ec; text-decoration:none; font-weight:400; letter-spacing:1.2px; font-size:14px; text-transform:uppercase; display:inline-flex; align-items:center; gap:8px; transition:color .2s; }
  .cta-bar a:hover { color:#2563eb; }
  .cta-bar .arrow { font-size:16px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
</style>
</head>
<body>

<div class="header-row">
  <h1>FIXORIUM AI SIGNAL</h1>
  <button id="refresh" class="icon-btn" title="Refresh signals" aria-label="Refresh signals">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="20" y1="8" x2="5" y2="8"></line>
      <polyline points="9 4 5 8 9 12"></polyline>
      <line x1="4" y1="16" x2="19" y2="16"></line>
      <polyline points="15 12 19 16 15 20"></polyline>
    </svg>
  </button>
</div>

<div class="marquee-bar">
  <div class="marquee-track">
    VOLATILITY-FILTERED PAIRS · EMA TREND · RSI MOMENTUM · ADX STRENGTH &nbsp;&nbsp;|&nbsp;&nbsp;
    <strong>NOT FINANCIAL ADVICE. SIGNALS ARE DECISION-SUPPORT ONLY.</strong>
    &nbsp;&nbsp;&nbsp;&nbsp;
  </div>
</div>

<div style="margin-bottom:12px;"><span class="badge" id="status">IDLE</span></div>

<div class="grid" id="cards"></div>
<div class="news" id="errorsBox"></div>

<div class="cta-bar">
  <a href="https://one.exnessonelink.com/a/abf72nul53" target="_blank" rel="noopener noreferrer">
    Create Account <span class="arrow">→</span>
  </a>
</div>

<!-- Trade dialog: confirm only, no password, no accounts -->
<dialog id="tradeDialog" style="background:#181b22; color:#e6e8ec; border:1px solid #222633; border-radius:12px; padding:20px; max-width:420px; width:90%; font-family:system-ui,sans-serif;">
  <h3 style="margin:0 0 12px; font-size:16px;">CONFIRM TRADE</h3>
  <div id="dialogSignalInfo" style="font-size:13px; color:#8a93a6; margin-bottom:16px;"></div>
  <div id="dialogError" style="color:#ef4444; font-size:12px; margin-bottom:8px; display:none;"></div>
  <div style="display:flex; gap:8px;">
    <button id="dialogCancel" style="flex:1; padding:10px; background:#222633; color:#e6e8ec; border:0; border-radius:6px; cursor:pointer; font-size:13px;">CANCEL</button>
    <button id="dialogExecute" style="flex:1; padding:10px; background:#22c55e; color:#fff; border:0; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600;">EXECUTE</button>
  </div>
</dialog>

<script>
/* ------------------------------------------------------------------
   CONFIG
------------------------------------------------------------------ */
const TWELVE_DATA_KEY = "1d6484a8e4204e15ac6e63de1192a73e";
const PAIRS = [
  { label: "EUR/GBP", symbol: "EUR/GBP" },
  { label: "EUR/CHF", symbol: "EUR/CHF" },
  { label: "GBP/CHF", symbol: "GBP/CHF" },
  { label: "AUD/NZD", symbol: "AUD/NZD" },
  { label: "USD/CHF", symbol: "USD/CHF" },
];
const SHOW_COUNT = 3;
const FIXED_LOT_SIZE = 0.01;
const SL_ATR_MULT = 1.5;
const TP_ATR_MULT = 3.0;

// Exness instrument names (no slash)
const EXNESS_SYMBOL_MAP = {
  'EUR/GBP': 'EURGBP', 'EUR/CHF': 'EURCHF', 'GBP/CHF': 'GBPCHF',
  'AUD/NZD': 'AUDNZD', 'USD/CHF': 'USDCHF',
};

// Your Exness account ID (from PA)
const EXNESS_ACCOUNT_ID = '11724101';

/* ------------------------------------------------------------------
   INDICATORS
------------------------------------------------------------------ */
function ema(values, period) {
  const k = 2 / (period + 1);
  let prev = values.slice(0, period).reduce((a,b)=>a+b,0) / period;
  for (let i = period; i < values.length; i++) prev = values[i]*k + prev*(1-k);
  return prev;
}
function rsi(closes, period = 14) {
  let g=0,l=0;
  for (let i=1;i<=period;i++){const d=closes[i]-closes[i-1]; d>=0?g+=d:l-=d;}
  let ag=g/period, al=l/period;
  for (let i=period+1;i<closes.length;i++){
    const d=closes[i]-closes[i-1];
    ag=(ag*(period-1)+(d>0?d:0))/period;
    al=(al*(period-1)+(d<0?-d:0))/period;
  }
  const rs = al===0?100:ag/al;
  return 100 - 100/(1+rs);
}
function atr(candles, period = 14) {
  const trs=[];
  for (let i=1;i<candles.length;i++){
    trs.push(Math.max(candles[i].high-candles[i].low, Math.abs(candles[i].high-candles[i-1].close), Math.abs(candles[i].low-candles[i-1].close)));
  }
  return trs.slice(-period).reduce((a,b)=>a+b,0)/period;
}
function adx(candles, period = 14) {
  const pDM=[],mDM=[],trs=[];
  for (let i=1;i<candles.length;i++){
    const up=candles[i].high-candles[i-1].high;
    const dn=candles[i-1].low-candles[i].low;
    pDM.push(up>dn&&up>0?up:0);
    mDM.push(dn>up&&dn>0?dn:0);
    trs.push(Math.max(candles[i].high-candles[i].low, Math.abs(candles[i].high-candles[i-1].close), Math.abs(candles[i].low-candles[i-1].close)));
  }
  let trS=trs.slice(0,period).reduce((a,b)=>a+b,0);
  let pS =pDM.slice(0,period).reduce((a,b)=>a+b,0);
  let mS =mDM.slice(0,period).reduce((a,b)=>a+b,0);
  const dxs=[];
  for (let i=period;i<trs.length;i++){
    trS=trS-trS/period+trs[i];
    pS =pS -pS /period+pDM[i];
    mS =mS -mS /period+mDM[i];
    const pDI=100*pS/trS, mDI=100*mS/trS;
    dxs.push(100*Math.abs(pDI-mDI)/(pDI+mDI||1));
  }
  if (dxs.length<period) return dxs[dxs.length-1]||0;
  return dxs.slice(-period).reduce((a,b)=>a+b,0)/period;
}

/* ------------------------------------------------------------------
   FETCH & EVALUATE
------------------------------------------------------------------ */
async function fetchSeries(pair) {
  const url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(pair.symbol)}&interval=15min&outputsize=200&apikey=${TWELVE_DATA_KEY}`;
  const res = await fetch(url);
  const json = await res.json();
  if (json.status === "error") throw new Error(json.message || "API error");
  if (!json.values || !json.values.length) throw new Error("Empty values array");
  const rows = json.values.slice().reverse();
  return { candles: rows.map(r => ({ high: parseFloat(r.high), low: parseFloat(r.low), close: parseFloat(r.close) })) };
}

function evaluate(candles) {
  const closes = candles.map(c=>c.close);
  const price = closes[closes.length-1];
  const eFast = ema(closes, 20);
  const eSlow = ema(closes, 50);
  const r = rsi(closes, 14);
  const a = atr(candles, 14);
  const d = adx(candles, 14);

  let score = 0;
  if (price > eFast) score++;
  if (eFast > eSlow) score++;
  if (r > 50) score++;
  if (d > 25) score++;

  let signal = "NEUTRAL";
  if (score >= 3) signal = "BUY";
  else if (score <= 1) signal = "SELL";

  const slDistance = a * SL_ATR_MULT;
  const tpDistance = a * TP_ATR_MULT;
  const entry = price;
  let tp = null, sl = null;
  if (signal === "BUY") { tp = price + tpDistance; sl = price - slDistance; }
  else if (signal === "SELL") { tp = price - tpDistance; sl = price + slDistance; }

  return {
    signal, confidence: Math.min(95, Math.round((Math.abs(score)/4)*100)),
    price, atr: a, atrPct: (a/price)*100, rsi: r, adx: d, emaFast: eFast, emaSlow: eSlow,
    entry, tp, sl, lotSize: FIXED_LOT_SIZE,
  };
}

/* ------------------------------------------------------------------
   RENDER
------------------------------------------------------------------ */
const cardsEl = document.getElementById("cards");
const statusEl = document.getElementById("status");
const errorsBox = document.getElementById("errorsBox");
const refreshBtn = document.getElementById("refresh");

function fmt(v) { return v === null ? "—" : v.toFixed(4); }

function renderCard(pair, data) {
  const levelsBlock = data.signal === "NEUTRAL"
    ? `<div class="levels"><div class="row"><span>ENTRY / TP / SL</span><span>— NO TRADE —</span></div><div class="row"><span>LOT SIZE</span><span class="lot-val">${data.lotSize.toFixed(2)}</span></div></div>`
    : `<div class="levels">
         <div class="row"><span>ENTRY</span><span class="entry-val">${fmt(data.entry)}</span></div>
         <div class="row"><span>TAKE PROFIT</span><span class="tp-val">${fmt(data.tp)}</span></div>
         <div class="row"><span>STOP LOSS</span><span class="sl-val">${fmt(data.sl)}</span></div>
         <div class="row"><span>LOT SIZE</span><span class="lot-val">${data.lotSize.toFixed(2)}</span></div>
       </div>`;

  cardsEl.insertAdjacentHTML("beforeend", `
    <div class="card" data-pair="${pair.label}" data-signal="${data.signal}" data-entry="${data.entry}" data-tp="${data.tp ?? ''}" data-sl="${data.sl ?? ''}">
      <div class="pair">${pair.label}</div>
      <div class="price">${data.price.toFixed(4)}</div>
      <div class="row"><span>ATR (VOL)</span><span>${data.atr.toFixed(4)} (${data.atrPct.toFixed(2)}%)</span></div>
      <div class="row"><span>RSI</span><span>${data.rsi.toFixed(1)}</span></div>
      <div class="row"><span>ADX</span><span>${data.adx.toFixed(1)}</span></div>
      <div class="row"><span>EMA20 / EMA50</span><span>${data.emaFast.toFixed(4)} / ${data.emaSlow.toFixed(4)}</span></div>
      ${levelsBlock}
      <div class="signal ${data.signal}" style="cursor:${data.signal !== 'NEUTRAL' ? 'pointer' : 'default'};" data-action="trade">${data.signal}</div>
      <div class="conf">CONFIDENCE: ${data.confidence}%</div>
    </div>`);
}

/* ------------------------------------------------------------------
   TRADE DIALOG — confirm only
------------------------------------------------------------------ */
const tradeDialog = document.getElementById('tradeDialog');
const dialogSignalInfo = document.getElementById('dialogSignalInfo');
const dialogError = document.getElementById('dialogError');
const dialogCancel = document.getElementById('dialogCancel');
const dialogExecute = document.getElementById('dialogExecute');

let pendingTrade = null;

cardsEl.addEventListener("click", async (e) => {
  const signalEl = e.target.closest('[data-action="trade"]');
  if (!signalEl) return;
  const card = signalEl.closest('.card');
  const signal = card.dataset.signal;
  if (signal !== 'BUY' && signal !== 'SELL') return;

  const pairLabel = card.dataset.pair;
  const entry = parseFloat(card.dataset.entry);
  const tp = card.dataset.tp ? parseFloat(card.dataset.tp) : null;
  const sl = card.dataset.sl ? parseFloat(card.dataset.sl) : null;
  const symbol = EXNESS_SYMBOL_MAP[pairLabel];
  if (!symbol) { alert('No Exness symbol mapping for ' + pairLabel); return; }

  pendingTrade = { signal, pairLabel, entry, tp, sl, symbol };
  dialogSignalInfo.innerHTML = `<strong style="color:#e6e8ec;">${signal} ${pairLabel}</strong><br>Entry: ${entry.toFixed(4)} · TP: ${tp ? tp.toFixed(4) : '—'} · SL: ${sl ? sl.toFixed(4) : '—'}`;
  dialogError.style.display = 'none';
  tradeDialog.showModal();
});

dialogCancel.addEventListener('click', () => { tradeDialog.close(); pendingTrade = null; });

dialogExecute.addEventListener('click', async () => {
  if (!pendingTrade) { tradeDialog.close(); return; }
  const { signal, symbol, tp, sl } = pendingTrade;

  dialogExecute.disabled = true;
  dialogExecute.textContent = 'SENDING...';
  dialogError.style.display = 'none';

  try {
    const res = await fetch('/api/exness/trade', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        accountId: EXNESS_ACCOUNT_ID,
        instrument: symbol,
        side: signal.toLowerCase(),        // "buy" or "sell"
        volume: String(FIXED_LOT_SIZE),    // decimal string
        takeProfitPrice: tp != null ? tp.toFixed(5) : null,  // decimal string
        stopLossPrice: sl != null ? sl.toFixed(5) : null,
      }),
    });
    const data = await res.json();

    if (!res.ok) {
      dialogError.textContent = data.error || data.detail?.error_message || 'Trade failed';
      dialogError.style.display = 'block';
      return;
    }

    alert('Order accepted. Operation ID: ' + (data.operation_id || '—'));
    tradeDialog.close();
    pendingTrade = null;

  } catch (err) {
    dialogError.textContent = 'Network error: ' + err.message;
    dialogError.style.display = 'block';
  } finally {
    dialogExecute.disabled = false;
    dialogExecute.textContent = 'EXECUTE';
  }
});

/* ------------------------------------------------------------------
   MAIN REFRESH
------------------------------------------------------------------ */
async function refresh() {
  cardsEl.innerHTML = "";
  errorsBox.innerHTML = "";
  refreshBtn.disabled = true;
  refreshBtn.classList.add("spinning");

  if (!TWELVE_DATA_KEY) {
    statusEl.textContent = "MISSING API KEY";
    cardsEl.innerHTML = `<div class="card">PASTE YOUR TWELVE DATA API KEY INTO TWELVE_DATA_KEY AND REDEPLOY.</div>`;
    refreshBtn.disabled = false;
    refreshBtn.classList.remove("spinning");
    return;
  }

  statusEl.textContent = "LOADING…";
  const results = await Promise.all(PAIRS.map(async p => {
    try { const { candles } = await fetchSeries(p); return { pair: p, ok: true, data: evaluate(candles) }; }
    catch (err) { return { pair: p, ok: false, error: err.message }; }
  }));

  const valid = results.filter(r => r.ok).map(r => ({ pair: r.pair, ...r.data }));
  valid.sort((a,b) => a.atrPct - b.atrPct);
  valid.slice(0, SHOW_COUNT).forEach(r => renderCard(r.pair, r));

  const failed = results.filter(r => !r.ok);
  if (failed.length) errorsBox.textContent = "SKIPPED: " + failed.map(f => `${f.pair.label} — ${f.error}`).join(" · ");

  statusEl.textContent = valid.length
    ? `UPDATED ${new Date().toLocaleTimeString()} · SHOWING ${Math.min(valid.length, SHOW_COUNT)} LOWEST-VOL PAIRS`
    : `UPDATED ${new Date().toLocaleTimeString()} · NO VALID DATA`;

  refreshBtn.disabled = false;
  refreshBtn.classList.remove("spinning");
}
refreshBtn.addEventListener("click", refresh);
refresh();
</script>
</body>
</html>
